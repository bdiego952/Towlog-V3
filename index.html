<title>Tow Case Log</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0A141C">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow+Semi+Condensed:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  /* NOAA chart paper: sand ground, navy ink, magenta = the mark you steer by */
  :root{
    --hull:#F2ECDB;          /* chart paper */
    --panel:#FBF8EF;         /* card */
    --panel-2:#FFFFFF;       /* raised card */
    --rule:#D9CFB2;          /* hairline */
    --ink:#152A3C;           /* chart navy */
    --ink-dim:#5E7080;
    --ink-faint:#9AA7A6;
    --signal:#BE1A67;        /* chart magenta — live / next / money */
    --wake:#0E7C6B;          /* sea green — done */
    --alarm:#BF3222;         /* signal red — danger only */
    --night:#31409B;         /* indigo — night hours */
    --warn:#9A6B00;          /* amber — backup nags */
    --barbg:rgba(242,236,219,.94);
    --grid:rgba(21,42,60,.045);
    --scrim:rgba(21,42,60,.5);
    --sel:#152A3C;           /* selected chip */
    --selfg:#fff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--hull)}
  #app{
    background:
      repeating-linear-gradient(0deg,var(--grid) 0 1px,transparent 1px 64px),
      repeating-linear-gradient(90deg,var(--grid) 0 1px,transparent 1px 64px),
      var(--hull);
    color:var(--ink);
    font-family:'Barlow Semi Condensed',-apple-system,system-ui,sans-serif;
    font-size:15.5px;line-height:1.45;min-height:100vh;
    padding:0 0 96px;max-width:560px;margin:0 auto;position:relative;
  }
  .lbl{font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.14em;font-weight:600}
  .mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}

  .bar{
    position:sticky;top:0;z-index:20;background:var(--barbg);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--rule);
    padding:14px 18px 12px;display:flex;align-items:center;gap:12px;
  }
  .bar h1{margin:0;font-size:15px;letter-spacing:.2em}
  .bar .sub{font-size:11px;color:var(--ink-dim);letter-spacing:.1em}
  .back{background:none;border:0;color:var(--signal);font-size:22px;padding:0 6px 0 0;cursor:pointer;line-height:1}
  .gear{background:none;border:0;color:var(--ink-dim);font-size:18px;cursor:pointer;padding:4px}
  .spacer{flex:1}

  button{font-family:inherit}
  .btn{
    display:block;width:100%;padding:15px;border-radius:3px;
    border:1px solid var(--rule);background:var(--panel-2);
    color:var(--ink);font-size:13px;letter-spacing:.14em;cursor:pointer;
  }
  .btn.primary{background:var(--signal);color:#fff;border-color:var(--signal);font-weight:700}
  .btn.ghost{background:transparent}
  .btn:active{transform:translateY(1px)}
  .btn[disabled]{opacity:.4;pointer-events:none}
  :focus-visible{outline:2px solid var(--signal);outline-offset:1px}

  .wrap{padding:18px}
  .sect-head{display:flex;align-items:baseline;gap:10px;font-size:11px;color:var(--ink-dim);letter-spacing:.16em;margin:26px 0 10px}
  .sect-head:first-child{margin-top:6px}
  .sect-head .count{color:var(--signal)}
  .rule{flex:1;height:1px;background:var(--rule)}

  .card{
    background:var(--panel-2);border:1px solid var(--rule);border-left:3px solid var(--rule);
    border-radius:3px;padding:13px 14px;margin-bottom:9px;cursor:pointer;
    display:flex;align-items:center;gap:12px;box-shadow:0 1px 0 rgba(0,0,0,.06);
  }
  .card.open{border-left-color:var(--signal)}
  .card.ready{border-left-color:var(--wake)}
  .card.filed{opacity:.55}
  .card .who{flex:1;min-width:0}
  .card .nm{font-weight:600;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .meta{font-size:11.5px;color:var(--ink-dim);margin-top:2px;letter-spacing:.03em}
  .card .hrs{text-align:right;font-size:19px;font-weight:700;color:var(--signal)}
  .card .hrs small{display:block;font-size:9px;letter-spacing:.14em;color:var(--ink-dim);font-weight:500}
  .card.filed .hrs{color:var(--ink-dim)}
  .empty{border:1px dashed var(--rule);border-radius:3px;padding:30px 22px;text-align:center;color:var(--ink-dim);font-size:13.5px;background:color-mix(in srgb,var(--panel-2) 45%,transparent)}

  .clock{
    background:var(--panel-2);
    border:1px solid var(--rule);border-radius:3px;padding:16px 18px;margin-bottom:20px;
    box-shadow:0 1px 0 rgba(21,42,60,.05);
  }
  .clock .top{display:flex;align-items:center;gap:8px;font-size:10.5px;letter-spacing:.18em;color:var(--ink-dim)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--ink-faint)}
  .dot.live{background:var(--signal);animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .clock .big{font-size:44px;font-weight:700;letter-spacing:-.02em;margin:6px 0 2px;line-height:1}
  .clock .payline{display:flex;gap:16px;font-size:12px;letter-spacing:.06em;margin-top:4px;flex-wrap:wrap}
  .clock .payline .pc{color:var(--ink-dim)}
  .clock .payline b{font-weight:600}
  .clock .payline .q{color:var(--signal);font-size:15px}
  .clock .payline .d{color:var(--ink)}
  .clock .payline .n{color:var(--night)}
  .clock .exact{font-size:10.5px;color:var(--ink-faint);letter-spacing:.08em;margin-top:6px}

  .tl{position:relative;padding-left:4px}
  .stage{display:flex;align-items:stretch;gap:14px;position:relative}
  .track{position:relative;width:26px;flex:none;display:flex;flex-direction:column;align-items:center}
  .pip{
    width:26px;height:26px;border-radius:50%;flex:none;
    border:1.5px solid var(--rule);background:var(--panel-2);
    display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:700;color:var(--ink-dim);z-index:2;margin-top:12px;
    transition:background .18s,border-color .18s,color .18s;
  }
  .line{width:1.5px;flex:1;background:var(--rule);margin:-2px 0}
  .stage:last-child .line{display:none}
  .stage.done .pip{background:var(--wake);border-color:var(--wake);color:#fff}
  .stage.done .line{background:var(--wake)}
  .stage.next .pip{border-color:var(--signal);color:var(--signal);box-shadow:0 0 0 4px color-mix(in srgb,var(--signal) 15%,transparent)}
  .hit{
    flex:1;display:flex;align-items:center;gap:10px;
    background:none;border:0;border-bottom:1px solid var(--rule);
    padding:16px 2px 15px;text-align:left;cursor:pointer;color:inherit;
  }
  .stage:last-child .hit{border-bottom:0}
  .hit .name{flex:1;font-size:12.5px;letter-spacing:.13em;color:var(--ink-dim)}
  .hit .name .fix{display:block;font-size:9px;letter-spacing:.12em;color:var(--ink-faint);margin-top:2px;font-family:'JetBrains Mono',monospace;text-transform:none}
  .stage.done .hit .name{color:var(--ink)}
  .stage.next .hit .name{color:var(--signal)}
  .hit .t{font-size:21px;font-weight:500;color:var(--ink-faint)}
  .stage.done .hit .t{color:var(--ink)}
  .hit .day{font-size:9.5px;color:var(--ink-dim);letter-spacing:.1em;margin-left:-4px}
  .tapme{font-size:9.5px;letter-spacing:.16em;color:#fff;background:var(--signal);border:1px solid var(--signal);border-radius:2px;padding:4px 8px}

  /* photos */
  .photos{display:flex;flex-wrap:wrap;gap:8px}
  .ph{width:86px;height:86px;border:1px solid var(--rule);border-radius:3px;background:var(--panel-2);padding:0;overflow:hidden;cursor:pointer;position:relative}
  .ph img{width:100%;height:100%;object-fit:cover;display:block;background:var(--panel)}
  .ph.phadd{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:1.5px dashed var(--signal);color:var(--signal);font-size:24px;background:color-mix(in srgb,var(--signal) 5%,transparent)}
  .ph.phadd small{font-size:8.5px;letter-spacing:.1em}
  .photos.dragover .phadd{background:color-mix(in srgb,var(--signal) 14%,transparent)}
  .phview img{max-width:100%;max-height:62vh;display:block;margin:0 auto;border:1px solid var(--rule);border-radius:3px}

  details{border-top:1px solid var(--rule)}
  details summary{
    padding:16px 2px;cursor:pointer;list-style:none;
    font-size:11.5px;letter-spacing:.16em;color:var(--ink-dim);
    display:flex;align-items:center;gap:9px;
  }
  details summary::-webkit-details-marker{display:none}
  details summary::after{content:'+';margin-left:auto;font-size:16px;color:var(--ink-dim)}
  details[open] summary::after{content:'–'}
  details summary .flag{width:6px;height:6px;border-radius:50%;background:var(--signal);opacity:0}
  details summary .flag.on{opacity:1}
  .fields{padding-bottom:18px}
  .row{display:flex;gap:9px}
  .row>*{flex:1;min-width:0}
  .f{margin-bottom:9px}
  .f label{display:block;font-size:9.5px;letter-spacing:.15em;color:var(--ink-dim);margin-bottom:5px;text-transform:uppercase;font-family:'Barlow Condensed',sans-serif;font-weight:600}
  .f input,.f textarea,.f select{
    width:100%;background:var(--panel-2);color:var(--ink);
    border:1px solid var(--rule);border-radius:3px;
    padding:11px;font-size:16px;font-family:inherit;
    -webkit-appearance:none;appearance:none;
  }
  .f select{background-image:linear-gradient(45deg,transparent 49%,var(--ink-dim) 50%),linear-gradient(135deg,var(--ink-dim) 50%,transparent 51%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat}
  .f textarea{min-height:96px;resize:vertical;line-height:1.5}
  .f input:focus,.f textarea:focus,.f select:focus{outline:2px solid var(--signal);outline-offset:-1px;border-color:var(--signal)}
  .hint{font-size:11px;color:var(--ink-dim);margin:-3px 0 12px;line-height:1.4}

  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .chip{background:var(--panel-2);border:1px solid var(--rule);color:var(--ink-dim);border-radius:2px;padding:9px 12px;font-size:12.5px;cursor:pointer}
  .chip.on{background:var(--sel);border-color:var(--sel);color:var(--selfg);font-weight:600}
  .chiplbl{display:block;font-size:9.5px;letter-spacing:.15em;color:var(--ink-dim);margin-bottom:6px;text-transform:uppercase;font-family:'Barlow Condensed',sans-serif;font-weight:600}

  .foot{
    position:fixed;bottom:0;left:0;right:0;z-index:20;
    background:var(--barbg);backdrop-filter:blur(8px);
    border-top:1px solid var(--rule);
    padding:12px 18px calc(12px + env(safe-area-inset-bottom));
    max-width:560px;margin:0 auto;display:flex;gap:9px;
  }
  .foot .btn{margin:0}

  .sheet{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
  .sheet-in{background:var(--hull);border-top:1px solid var(--rule);width:100%;max-width:560px;max-height:92vh;display:flex;flex-direction:column}
  .sheet-hd{padding:16px 18px;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.16em;color:var(--ink-dim)}
  .sheet-bd{overflow:auto;padding:14px 18px;-webkit-overflow-scrolling:touch}
  .sheet-bd pre{margin:0;white-space:pre-wrap;word-break:break-word;font-size:12.5px;line-height:1.65;color:var(--ink);font-family:'JetBrains Mono',monospace}
  .sheet-ft{padding:12px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--rule);display:flex;gap:9px}

  .modal{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:24px}
  .modal-in{background:var(--panel-2);border:1px solid var(--rule);border-radius:3px;width:100%;max-width:340px;padding:18px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
  .modal-in.wide{max-width:460px}
  .modal-in h3{margin:0 0 4px;font-size:12px;letter-spacing:.16em;color:var(--ink-dim)}
  .modal-in .tin{width:100%;background:var(--panel);color:var(--ink);border:1px solid var(--rule);border-radius:3px;padding:12px;font-size:22px;margin:12px 0;font-family:'JetBrains Mono',monospace}
  .modal-in .mrow{display:flex;gap:8px}

  .toast{
    position:fixed;bottom:96px;left:50%;transform:translateX(-50%);
    background:var(--wake);color:#fff;font-weight:600;font-size:12.5px;
    letter-spacing:.1em;padding:11px 18px;border-radius:3px;z-index:60;
    opacity:0;transition:opacity .2s;pointer-events:none;text-align:center;
    box-shadow:0 4px 16px rgba(0,0,0,.3);
  }
  .toast.on{opacity:1}
  .loading{padding:60px 20px;text-align:center;color:var(--ink-dim);font-size:12px;letter-spacing:.16em}

  .set-item{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--rule);padding:10px 0}
  .set-item .n{flex:1;font-size:13.5px}
  .set-item input{background:var(--panel-2);color:var(--ink);border:1px solid var(--rule);border-radius:3px;padding:8px;font-size:14px}
  .addrow{display:flex;gap:8px;margin-top:10px}
  .addrow input{flex:1;background:var(--panel-2);color:var(--ink);border:1px solid var(--rule);border-radius:3px;padding:10px;font-size:14px}
  .addrow .btn{width:auto;padding:10px 16px}
  .seg{display:flex;border:1px solid var(--rule);border-radius:3px;overflow:hidden;margin-bottom:10px}
  .seg button{flex:1;padding:11px;background:var(--panel-2);border:0;color:var(--ink-dim);font-size:12px;letter-spacing:.1em;cursor:pointer}
  .seg button.on{background:var(--sel);color:var(--selfg);font-weight:700}

  .nag{display:block;width:100%;background:color-mix(in srgb,var(--warn) 10%,transparent);border:1px solid var(--warn);color:var(--warn);border-radius:3px;padding:11px;font-size:11px;letter-spacing:.12em;cursor:pointer;margin-bottom:14px;text-align:center}
  .namef{margin-bottom:16px}
  .namef input{font-size:19px!important;font-weight:600;padding:13px 12px!important}
  .namef input::placeholder{font-weight:400;font-size:15px;color:var(--ink-faint)}
  .savechip{font-size:9.5px;letter-spacing:.14em;color:var(--wake);margin-left:8px}
  .savechip.bad{color:var(--alarm)}
  .storebanner{position:fixed;top:0;left:0;right:0;z-index:100;color:#fff;font-size:11.5px;letter-spacing:.05em;padding:9px 14px;text-align:center;font-weight:600;line-height:1.4}
  .storebanner button{margin-top:6px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.5);color:#fff;font-size:10.5px;letter-spacing:.14em;padding:6px 14px;border-radius:2px;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-weight:600}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app"><div class="loading lbl">Loading log…</div></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  const CKEY='towlog:cases:v2', SKEY='towlog:settings:v1';
  const LAT=33.7683, LNG=-118.1956;
  const STAGES=[
    {k:'t1',n:'Towboat out'},
    {k:'t2',n:'On scene'},
    {k:'t3',n:'In tow'},
    {k:'t4',n:'Tow completed'},
    {k:'t5',n:'Towboat at base'}
  ];
  const THEMES={
    chart:{ hull:'#F2ECDB',panel:'#FBF8EF','panel-2':'#FFFFFF',rule:'#D9CFB2',ink:'#152A3C','ink-dim':'#5E7080','ink-faint':'#9AA7A6',
      signal:'#BE1A67',wake:'#0E7C6B',alarm:'#BF3222',night:'#31409B',warn:'#9A6B00',
      barbg:'rgba(242,236,219,.94)',grid:'rgba(21,42,60,.045)',scrim:'rgba(21,42,60,.5)',sel:'#152A3C',selfg:'#fff' },
    wheelhouse:{ hull:'#0A141C',panel:'#132330','panel-2':'#182D3C',rule:'#254458',ink:'#E6EFF4','ink-dim':'#7E99AA','ink-faint':'#3E5768',
      signal:'#F5A623',wake:'#3FB68F',alarm:'#E5533D',night:'#8FA8FF',warn:'#D89A2B',
      barbg:'rgba(10,20,28,.94)',grid:'rgba(255,255,255,.03)',scrim:'rgba(6,12,17,.82)',sel:'#F5A623',selfg:'#0A141C' },
    nightwatch:{ hull:'#0B0908',panel:'#171210','panel-2':'#1E1714',rule:'#3A2A22',ink:'#F3E9E2','ink-dim':'#A08A7C','ink-faint':'#5C4A3F',
      signal:'#FF7847',wake:'#3FB68F',alarm:'#E5382B',night:'#8F9BFF',warn:'#E0A33B',
      barbg:'rgba(11,9,8,.94)',grid:'rgba(255,120,71,.05)',scrim:'rgba(0,0,0,.75)',sel:'#FF7847',selfg:'#14100E' },
    response:{ hull:'#F7F8F9',panel:'#EFF2F4','panel-2':'#FFFFFF',rule:'#D3DAE0',ink:'#1C2B33','ink-dim':'#5D707C','ink-faint':'#A3B1BA',
      signal:'#E8570F',wake:'#0B7D62',alarm:'#C7231C',night:'#2F4CB3',warn:'#9A6B00',
      barbg:'rgba(247,248,249,.94)',grid:'rgba(28,43,51,.05)',scrim:'rgba(28,43,51,.5)',sel:'#1C2B33',selfg:'#fff' },
    deepwater:{ hull:'#0C1B1E',panel:'#12262B','panel-2':'#173036',rule:'#274A52',ink:'#E3F1F2','ink-dim':'#7FA0A6','ink-faint':'#3F626A',
      signal:'#2ED3B7',wake:'#4CC38A',alarm:'#F0564A',night:'#92A8FF',warn:'#D8A031',
      barbg:'rgba(12,27,30,.94)',grid:'rgba(46,211,183,.04)',scrim:'rgba(4,12,14,.8)',sel:'#2ED3B7',selfg:'#062A26' }
  };
  const THEME_NAMES={chart:'Chart paper',wheelhouse:'Wheelhouse',nightwatch:'Night watch',response:'Response',deepwater:'Deep water'};
  function applyTheme(){
    const t=THEMES[settings&&settings.theme]||THEMES.chart;
    for(const k in t)document.documentElement.style.setProperty('--'+k,t[k]);
    const m=document.querySelector('meta[name="theme-color"]'); if(m)m.content=t.hull;
  }

  const DEFAULT_SETTINGS={
    theme:'chart',
    lastBackup:0,
    minHours:2,
    nightMode:'sun',
    nightStart:'18:00', nightEnd:'06:00',
    towboats:['Huntington Beach','Seal Beach','Long Beach'],
    places:['Alamitos Bay Marina','Long Beach Shoreline Marina','Rainbow Harbor','Naples','Huntington Harbour','Seal Beach','Island White','Island Chaffee']
  };

  let cases=[], settings=null;
  let view={screen:'list', id:null};
  let ticker=null;

  /* ---------- storage v3 — the phone keeps its own log ----------
     Every change writes three copies, all on-device, all instant:
       1. localStorage — synchronous; survives the app being killed mid-keystroke
       2. IndexedDB    — a second copy in a separate iOS storage system
       3. a daily snapshot (last 7 days kept) — fat-finger insurance
     No network, no rate limits, no retries, no races. If this phone works,
     the log works. */
  const BLOB='towlog:v3';
  let saveState='boot', lastSaved=0, writeCount=0, failStreak=0, lastErr='';
  const frozen=()=>saveState==='nostore';

  const LS=(()=>{try{const t='towlog:probe';localStorage.setItem(t,'1');localStorage.removeItem(t);return localStorage;}catch(e){return null;}})();
  let idb=null;
  function idbOpen(){return new Promise(res=>{try{const rq=indexedDB.open('towlog',2);rq.onupgradeneeded=()=>{const db=rq.result;if(!db.objectStoreNames.contains('kv'))db.createObjectStore('kv');if(!db.objectStoreNames.contains('img'))db.createObjectStore('img');};rq.onsuccess=()=>res(rq.result);rq.onerror=()=>res(null);}catch(e){res(null);}});}
  function idbImgSet(k,v){return new Promise(res=>{if(!idb)return res();try{const tx=idb.transaction('img','readwrite');tx.objectStore('img').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>res();}catch(e){res();}});}
  function idbImgGet(k){return new Promise(res=>{if(!idb)return res(null);try{const rq=idb.transaction('img','readonly').objectStore('img').get(k);rq.onsuccess=()=>res(rq.result||null);rq.onerror=()=>res(null);}catch(e){res(null);}});}
  function idbImgDel(k){return new Promise(res=>{if(!idb)return res();try{const tx=idb.transaction('img','readwrite');tx.objectStore('img').delete(k);tx.oncomplete=()=>res();tx.onerror=()=>res();}catch(e){res();}});}
  function idbGet(k){return new Promise(res=>{if(!idb)return res(null);try{const rq=idb.transaction('kv','readonly').objectStore('kv').get(k);rq.onsuccess=()=>res(rq.result==null?null:rq.result);rq.onerror=()=>res(null);}catch(e){res(null);}});}
  function idbSet(k,v){if(!idb)return;try{idb.transaction('kv','readwrite').objectStore('kv').put(v,k);}catch(e){}}

  function pack(){return JSON.stringify({t:Date.now(),v:3,cases,settings});}
  async function packFull(){
    const images={};
    for(const c of cases)for(const pid of (c.photos||[])){const d=await idbImgGet(pid);if(d)images[pid]=d;}
    return JSON.stringify({t:Date.now(),v:3,cases,settings,images});
  }
  function unpack(raw){try{const o=JSON.parse(raw);if(o&&Array.isArray(o.cases))return o;}catch(e){}return null;}

  function persist(){
    if(saveState==='boot'||frozen())return;
    const raw=pack();
    let ok=false;
    if(LS){try{LS.setItem(BLOB,raw);ok=true;}catch(e){lastErr=(e&&e.message)||'phone storage write failed';}}
    idbSet(BLOB,raw);
    if(ok||idb){saveState='ok';lastSaved=Date.now();writeCount++;failStreak=0;if(ok)lastErr='';snapshot(raw);}
    else{failStreak++;saveState='degraded';}
    paintStatus();
  }
  function snapshot(raw){
    if(!LS)return;
    try{
      const d=new Date(),key='towlog:v3:snap:'+d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
      LS.setItem(key,raw);
      const snaps=[];for(let i=0;i<LS.length;i++){const k=LS.key(i);if(k&&k.indexOf('towlog:v3:snap:')===0)snaps.push(k);}
      snaps.sort().slice(0,-7).forEach(k=>LS.removeItem(k));
    }catch(e){}
  }
  const saveCases=()=>persist();
  const saveSettings=()=>persist();
  const flushNow=()=>persist();

  async function load(){
    try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
    idb=await idbOpen();
    const a=LS?unpack(LS.getItem(BLOB)):null;
    const b=unpack(await idbGet(BLOB));
    const best=(a&&b)?(b.t>a.t?b:a):(a||b);      // newest surviving copy wins
    cases=best?(best.cases||[]):[];
    settings=Object.assign({},DEFAULT_SETTINGS,best?(best.settings||{}):{});
    cases.forEach(c=>{if(!c.gps)c.gps={};if(!c.lineItems)c.lineItems=[];if(!c.photos)c.photos=[];});
    if(!settings.towboats||!settings.towboats.length)settings.towboats=DEFAULT_SETTINGS.towboats.slice();
    if(JSON.stringify(settings.towboats)===JSON.stringify(['Long Beach','Seal Beach','Huntington Beach']))settings.towboats=DEFAULT_SETTINGS.towboats.slice();
    if(!LS&&!idb){saveState='nostore';return;}
    saveState='ok'; if(best)lastSaved=best.t;
  }
  function retryStore(){location.reload();}

  function statusText(){
    if(saveState==='nostore')return 'NOT SAVING';
    if(saveState==='degraded')return 'CHECK STORAGE';
    return lastSaved?'SAVED '+hhmm(lastSaved):'READY';
  }
  function paintStatus(){
    const e=document.getElementById('savestatus');if(!e)return;
    e.textContent=statusText();
    e.className='savechip lbl'+((frozen()||saveState==='degraded')?' bad':'');
  }

  window.addEventListener('pagehide',()=>persist());

  /* backups */
  function importJSON(raw){
    const o=unpack(raw);
    if(!o)return false;
    const byId={};cases.forEach(c=>byId[c.id]=c);(o.cases||[]).forEach(c=>byId[c.id]=c);
    cases=Object.keys(byId).map(k=>byId[k]);
    if(o.settings)settings=Object.assign({},DEFAULT_SETTINGS,o.settings);
    if(o.images)Object.keys(o.images).forEach(k=>idbImgSet(k,o.images[k]));
    cases.forEach(c=>{if(!c.gps)c.gps={};if(!c.lineItems)c.lineItems=[];if(!c.photos)c.photos=[];});
    persist();return true;
  }
  async function backupToFiles(){
    const d=new Date();
    const name='tow-log-backup-'+d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'.json';
    const done=()=>{settings.lastBackup=Date.now();persist();render();};
    const raw=await packFull();
    try{
      if(navigator.canShare&&window.File){
        const f=new File([raw],name,{type:'application/json'});
        if(navigator.canShare({files:[f]})){
          navigator.share({files:[f]}).then(()=>{done();toast('Backed up — pick Save to Files → iCloud Drive');}).catch(()=>{});
          return;
        }
      }
    }catch(e){}
    const url=URL.createObjectURL(new Blob([raw],{type:'application/json'}));
    const a=document.createElement('a');a.href=url;a.download=name;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    done();toast('Backup file saved');
  }
  function restoreFromFile(){
    const inp=document.createElement('input');

    inp.onchange=()=>{

      const r=new FileReader();

        else toast('That file is not a tow log backup',1);

    };

  function compressImage(file){
    return new Promise(res=>{
      const img=new Image();
      img.onload=()=>{
        const MAX=1400, sc=Math.min(1,MAX/Math.max(img.width,img.height));
        const cv=document.createElement('canvas');
        cv.width=Math.max(1,Math.round(img.width*sc)); cv.height=Math.max(1,Math.round(img.height*sc));
        cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
        URL.revokeObjectURL(img.src);
        res(cv.toDataURL('image/jpeg',0.82));
      };
      img.onerror=()=>{URL.revokeObjectURL(img.src);res(null);};
      img.src=URL.createObjectURL(file);
    });
  }

  /* ---------- read a screenshot into the case ---------- */
  function loadScript(src){return new Promise((res,rej)=>{const sc=document.createElement('script');sc.src=src;sc.onload=res;sc.onerror=rej;document.head.appendChild(sc);});}

  const FIELD_LABELS={
    boatName:['boat name','vessel name','vessel','boat'],
    make:['make','manufacturer','brand'],
    length:['length','loa','boat length'],
    color:['color','colour'],
    boatType:['boat type','vessel type','type'],
    regNum:['registration','registration #','reg #','reg number','cf number','cf #'],
    ownerPhone:['phone','phone number','cell','mobile','contact number'],
    ownerEmail:['email','e-mail'],
    memId:['member id','member #','member number','membership','mem id'],
    coverage:['coverage','coverage level'],
    expDate:['exp date','expiration','expires','exp'],
    dispatchNum:['dispatch #','dispatch number','dispatch','case #','case number'],
    refNum:['ref num','ref #','reference'],
    pob:['pob','persons on board','people on board','# pob'],
    locText:['tow location','current location','location','position'],
    dest:['destination','tow to','tow destination'],
    reason:['reason','reason for tow','issue','problem','service type','service needed'],
    eta:['eta'],
    contacted:['time contacted','contacted']
  };
  const PRETTY={boatName:'Boat name',make:'Make',length:'Length',color:'Color',boatType:'Type',regNum:'Registration #',
    ownerFirst:'First name',ownerLast:'Last name',ownerPhone:'Phone',ownerEmail:'Email',memId:'Member ID',coverage:'Coverage',
    expDate:'Exp date',dispatchNum:'Dispatch #',refNum:'Ref num',pob:'POB',locText:'Tow location',dest:'Destination',
    reason:'Reason',eta:'ETA',contacted:'Time contacted'};

  function parseDispatch(text){
    const found={};
    const lines=text.split(/\n+/).map(l=>l.trim()).filter(Boolean);
    const grab=(line,next)=>{
      const m=line.match(/^([A-Za-z #\/-]{2,26}?)\s*[:\-–]\s*(.+)$/);
      if(m){return {label:m[1].toLowerCase().trim(),value:m[2].trim()};}
      // label on its own line, value on the next
      const bare=line.toLowerCase().trim();
      for(const k in FIELD_LABELS) if(FIELD_LABELS[k].indexOf(bare)>-1 && next) return {label:bare,value:next.trim()};
      return null;
    };
    for(let i=0;i<lines.length;i++){
      const g=grab(lines[i],lines[i+1]); if(!g||!g.value)continue;
      for(const key in FIELD_LABELS){
        if(found[key])continue;
        if(FIELD_LABELS[key].some(lbl=>g.label===lbl||g.label.endsWith(lbl))){found[key]=g.value;break;}
      }
      if(!found.ownerFirst&&/^(member name|name|contact|owner)$/.test(g.label)||/^(member name|contact name|owner name)$/.test(g.label)){
        const parts=g.value.replace(/[^A-Za-z '\-]/g,'').trim().split(/\s+/);
        if(parts.length>=2){found.ownerFirst=parts[0];found.ownerLast=parts.slice(1).join(' ');}
        else if(parts.length===1){found.ownerLast=parts[0];}
      }
    }
    const whole=text.replace(/\n/g,' ');
    if(!found.ownerPhone){const m=whole.match(/\(?\b\d{3}\)?[\s.\-]\d{3}[\s.\-]\d{4}\b/);if(m)found.ownerPhone=m[0];}
    if(!found.ownerEmail){const m=whole.match(/\b[\w.+-]+@[\w-]+\.[\w.]{2,}\b/);if(m)found.ownerEmail=m[0];}
    if(!found.length){const m=whole.match(/\b(\d{2})\s?(?:ft|feet|')\b/i);if(m)found.length=m[1];}
    if(!found.pob){const m=whole.match(/(\d{1,2})\s*(?:persons?|people|souls|pob)\b/i);if(m)found.pob=m[1];}
    if(found.length)found.length=String(found.length).replace(/[^\d.]/g,'');
    if(found.pob)found.pob=String(found.pob).replace(/[^\d]/g,'');
    return found;
  }

  async function scanPhoto(pid){
    const c=getCase(view.id); if(!c)return;
    const dataURL=await idbImgGet(pid);
    if(!dataURL){toast('Could not load that image',1);return;}
    const el=document.createElement('div');el.className='modal';
    el.innerHTML=`<div class="modal-in"><h3 class="lbl">Reading screenshot…</h3>
      <div class="hint" id="ocrpct" style="margin:12px 0 4px">Loading the reader — first time takes a moment.</div></div>`;
    document.body.appendChild(el);
    try{
      if(!window.Tesseract) await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');
      const r=await Tesseract.recognize(dataURL,'eng',{logger:m=>{
        const pe=document.getElementById('ocrpct');

      const keys=Object.keys(found).filter(k=>found[k]);

  function reviewFields(c,found,keys){
    const rows=keys.map(k=>{
      const taken=c[k]&&String(c[k]).trim();
      return `<div class="set-item"><div class="n">${PRETTY[k]||k}<small style="display:block;color:var(--ink-dim)">${esc(found[k])}</small></div>
        <div class="lbl" style="font-size:9px;color:${taken?'var(--ink-faint)':'var(--wake)'}">${taken?'ALREADY SET':'WILL FILL'}</div></div>`;
    }).join('');
    const fillable=keys.filter(k=>!(c[k]&&String(c[k]).trim()));
    const el=document.createElement('div');el.className='modal';
    el.innerHTML=`<div class="modal-in wide"><h3 class="lbl">Found on the screenshot</h3>
      <div style="max-height:46vh;overflow:auto;margin:10px 0">${rows}</div>
      <div class="hint">Only empty fields get filled — nothing you typed is touched. Double-check against the photo; the reader is good, not perfect.</div>
      <div class="mrow">
        <button class="btn ghost lbl" data-cancel>Cancel</button>
        <button class="btn primary lbl" data-ok ${fillable.length?'':'disabled'}>Fill ${fillable.length} field${fillable.length===1?'':'s'}</button>

    el.addEventListener('click',e=>{

    });
    document.body.appendChild(el);
  }

  /* ---------- GPS ---------- */
  function toDDM(dec, isLat){
    const hemi = isLat ? (dec>=0?'N':'S') : (dec>=0?'E':'W');
    const a=Math.abs(dec), deg=Math.floor(a), min=(a-deg)*60;
    return deg+'°'+min.toFixed(3)+"'"+hemi;
  }
  function grabGPS(c,k){
    if(!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(pos=>{
      c.gps[k]={lat:pos.coords.latitude,lng:pos.coords.longitude,acc:Math.round(pos.coords.accuracy)};
      if(k==='t2'){ // on scene fills the VSS lat/long if empty
        if(!c.lat) c.lat=toDDM(pos.coords.latitude,true);
        if(!c.lng) c.lng=toDDM(pos.coords.longitude,false);
      }
      saveCases();
      if(view.screen==='case'&&view.id===c.id) render();
    }, ()=>{}, {enableHighAccuracy:true, timeout:8000, maximumAge:15000});
  }

  /* ---------- hours & pay math ---------- */
  const exactMs=c=>(!c.t1||!c.t5)?null:Math.max(0,c.t5-c.t1);
  const liveMs=c=>!c.t1?null:Math.max(0,(c.t5||Date.now())-c.t1);
  const decH=ms=>ms/3600000;
  const round4=h=>Math.round(h*4)/4;                 // nearest quarter hour
  const hms=ms=>{const s=Math.floor(ms/1000);return pad(Math.floor(s/3600))+':'+pad(Math.floor(s/60)%60)+':'+pad(s%60);};

  // Sun math rebuilt (the old version compared against the NEXT day's window,
  // so daylight tows billed as night). Standard suncalc formulation, window
  // chosen as the solar day nearest to t, cached per transit.
  const sunCache={};
  function sunTimes(ms){
    const rad=Math.PI/180, J1970=2440588, J2000=2451545;
    const lw=rad*-LNG, phi=rad*LAT;
    const d=ms/86400000-0.5+J1970-J2000;
    const n=Math.round(d-0.0009-lw/(2*Math.PI));
    if(sunCache[n])return sunCache[n];
    const ds=0.0009+lw/(2*Math.PI)+n;
    const M=rad*(357.5291+0.98560028*ds);
    const C=rad*(1.9148*Math.sin(M)+0.02*Math.sin(2*M)+0.0003*Math.sin(3*M));
    const L=M+C+rad*102.9372+Math.PI;
    const Jtr=ds+0.0053*Math.sin(M)-0.0069*Math.sin(2*L);
    const dec=Math.asin(Math.sin(L)*Math.sin(rad*23.4397));
    const co=(Math.sin(rad*-0.833)-Math.sin(phi)*Math.sin(dec))/(Math.cos(phi)*Math.cos(dec));
    if(co<-1||co>1)return null;
    const w=Math.acos(co);
    const toMs=dd=>(dd+J2000-J1970+0.5)*86400000;
    return sunCache[n]={rise:toMs(Jtr-w/(2*Math.PI)), set:toMs(Jtr+w/(2*Math.PI))};
  }
  function isNightAt(t){
    if(settings.nightMode==='fixed'){
      const d=new Date(t), mins=d.getHours()*60+d.getMinutes();
      const [sh,sm]=settings.nightStart.split(':').map(Number);
      const [eh,em]=settings.nightEnd.split(':').map(Number);
      const ns=sh*60+sm, ne=eh*60+em;
      return ns>ne ? (mins>=ns||mins<ne) : (mins>=ns&&mins<ne);
    }
    const su=sunTimes(t)||{rise:-Infinity,set:Infinity};
    return !(t>=su.rise&&t<=su.set);
  }
  // returns {totalQ, dayQ, nightQ, exact, minApplied} — quarter-rounded,
  // per-call minimum enforced, day+night always sums to totalQ
  function payHours(c){
    const ms=exactMs(c);
    if(ms===null) return null;
    const exact=decH(ms);
    let totalQ=round4(exact);
    let night=0;
    const step=60000, cap=36*3600000;
    const end=Math.min(c.t5, c.t1+cap);
    for(let t=c.t1;t<end;t+=step) if(isNightAt(t)) night+=step;
    let nightQ=round4(decH(night));
    if(nightQ>totalQ) nightQ=totalQ;
    const minH=settings.minHours||0;
    let minApplied=false;
    if(totalQ<minH){
      // pad up to the minimum; padding bills at the rate in effect at towboat out
      const pad=minH-totalQ;
      if(isNightAt(c.t1)) nightQ+=pad;
      totalQ=minH;
      minApplied=true;
    }
    return {totalQ, nightQ, dayQ:Math.max(0,totalQ-nightQ), exact, minApplied};
  }

  /* ---------- render: list ---------- */
  function renderList(){
    const open=cases.filter(c=>c.status!=='filed').sort((a,b)=>b.createdAt-a.createdAt);
    const filed=cases.filter(c=>c.status==='filed').sort((a,b)=>b.createdAt-a.createdAt);
    const unfiled=open.reduce((s,c)=>{const p=payHours(c);return s+(p?p.totalQ:0);},0);

    const card=c=>{
      const p=payHours(c);
      const running=c.t1&&!c.t5;
      const cls=c.status==='filed'?'filed':(p?'ready':'open');
      const title=caseTitle(c);
      const bits=[dayLabel(c.createdAt),c.source==='vhf'?'VHF':'Redcraft',c.reason].filter(Boolean);
      const hrs=p?p.totalQ.toFixed(2):(running?'···':'—');
      const sub=p?'HRS':(running?'RUNNING':'NOT STARTED');
      return `<div class="card ${cls}" data-open="${c.id}">
        <div class="who"><div class="nm">${esc(title)}</div><div class="meta">${esc(bits.join('  ·  '))}</div></div>
        <div class="hrs mono">${hrs}<small class="lbl">${sub}</small></div>
      </div>`;
    };

    return `
      <div class="bar">
        <div><h1 class="lbl">Case Log</h1><div class="sub lbl">TowBoatUS · Long Beach · v4<span id="savestatus" class="savechip lbl"></span></div></div>
        <div class="spacer"></div>
        <div class="hrs mono" style="text-align:right;font-size:19px;font-weight:700;color:var(--signal)">
          ${unfiled.toFixed(2)}
          <small class="lbl" style="display:block;font-size:9px;letter-spacing:.14em;color:var(--ink-dim);font-weight:500">UNFILED HRS</small>
        </div>
        <button class="gear" data-settings title="Settings">⚙</button>
      </div>
      <div class="wrap">
        ${(()=>{if(!cases.length)return '';
          const age=settings.lastBackup?Math.floor((Date.now()-settings.lastBackup)/86400000):null;
          if(age!==null&&age<7)return '';
          return `<button class="nag lbl" data-backupfile>${age===null?'No backup saved yet':'Last backup '+age+' days ago'} — tap to save one to Files</button>`;})()}
        <div class="sect-head lbl"><span>Needs filing</span><span class="count mono">${open.length}</span><span class="rule"></span></div>
        ${open.length?open.map(card).join(''):'<div class="empty">Nothing outstanding. Start a case when the call comes in.</div>'}
        ${filed.length?`<div class="sect-head lbl"><span>Filed</span><span class="count mono">${filed.length}</span><span class="rule"></span></div>${filed.map(card).join('')}`:''}
      </div>
      <div class="foot">
        <button class="btn primary lbl" data-new="redcraft">New · Redcraft</button>
        <button class="btn lbl" data-new="vhf">New · VHF</button>
      </div>`;
  }

  /* ---------- render: case ---------- */
  function field(c,k,label,opts){
    opts=opts||{};
    const v=esc(c[k]);
    if(opts.area) return `<div class="f"><label>${label}</label><textarea data-f="${k}" placeholder="${opts.ph||''}">${v}</textarea></div>`;
    return `<div class="f"><label>${label}</label><input data-f="${k}" value="${v}" placeholder="${opts.ph||''}" inputmode="${opts.im||'text'}"></div>`;
  }
  function pickChips(c,k,list){
    if(!list.length) return '';
    return `<div class="chips" data-pick="${k}">${list.map(v=>`<button class="chip ${c[k]===v?'on':''}" data-v="${esc(v)}">${esc(v)}</button>`).join('')}</div>`;
  }

  function renderCase(){
    const c=getCase(view.id);
    if(!c){view={screen:'list'};return renderList();}
    const nextIdx=STAGES.findIndex(st=>!c[st.k]);
    const ms=liveMs(c);
    const running=c.t1&&!c.t5;
    const p=payHours(c);

    const stages=STAGES.map((st,i)=>{
      const done=!!c[st.k];
      const isNext=i===nextIdx;
      const t=done?hhmm(c[st.k]):'––:––';
      const crossed=done&&c.t1&&new Date(c[st.k]).getDate()!==new Date(c.t1).getDate();
      const fix=c.gps[st.k]?`<span class="fix">${toDDM(c.gps[st.k].lat,true)}  ${toDDM(c.gps[st.k].lng,false)}</span>`:'';
      return `<div class="stage ${done?'done':''} ${isNext?'next':''}">
        <div class="track"><div class="pip mono">${done?'✓':(i+1)}</div><div class="line"></div></div>
        <button class="hit" data-stamp="${st.k}">
          <span class="name lbl">${st.n}${fix}</span>
          ${crossed?`<span class="day lbl mono">${dayLabel(c[st.k])}</span>`:''}
          <span class="t mono">${t}</span>
          ${isNext?'<span class="tapme lbl">Mark</span>':''}
        </button>
      </div>`;
    }).join('');

    const has=keys=>keys.some(k=>c[k]);
    const title=caseTitle(c);
    const photos=(c.photos||[]).map(pid=>`<button class="ph" data-phview="${pid}"><img data-pid="${pid}" alt=""></button>`).join('');

    return `
      <div class="bar">
        <button class="back" data-back>‹</button>
        <div style="min-width:0">
          <h1 id="casetitle" class="lbl" data-focusname style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer">${esc(title)}</h1>
          <div class="sub lbl">${c.source==='vhf'?'VHF · build in VSS':'Redcraft'} · ${dayLabel(c.createdAt)}<span id="savestatus" class="savechip lbl"></span></div>
        </div>
      </div>
      <div class="wrap">
        <div class="f namef">
          <label>Case name — boat name if you have it</label>
          <input id="casename" data-f="boatName" value="${esc(c.boatName)}" placeholder="${c.source==='vhf'?'Sea Fox — or &quot;blue Bayliner off Island White&quot;':'Boat name from dispatch'}">
        </div>

        <div class="clock">
          <div class="top lbl"><span class="dot ${running?'live':''}"></span>${running?'Running':(c.t5?'Complete':'Not started')}</div>
          <div class="big mono" id="bigclock">${ms===null?'––:––:––':hms(ms)}</div>
          ${p?`
            <div class="payline lbl">
              <span class="pc">Billed <b class="q mono">${p.totalQ.toFixed(2)}</b></span>
              <span class="pc">Day <b class="d mono">${p.dayQ.toFixed(2)}</b></span>
              <span class="pc">Night <b class="n mono">${p.nightQ.toFixed(2)}</b></span>
            </div>
            <div class="exact mono">exact ${p.exact.toFixed(2)} → nearest ¼ hr${p.minApplied?' → '+(settings.minHours||2)+'-hr minimum applied':''}</div>
          `:`<div class="payline lbl"><span class="pc">Billing starts at Towboat out</span></div>`}
        </div>

        <div class="tl">${stages}</div>

        ${c.t4&&!c.t5?`<button class="btn lbl" style="margin:14px 0 4px;border-color:var(--signal);color:var(--signal)" data-rollover>At base won't happen — roll straight into next call</button>
        <div class="hint" style="text-align:center">Stamps "at base" now and opens a new case with "towboat out" at the same minute — no gap, no double-billing.</div>`:''}

        <div class="f" style="margin-top:20px">
          <label>Towboat used</label>
          <select data-f="towboat">
            <option value=""${!c.towboat?' selected':''}>—</option>
            ${settings.towboats.map(b=>`<option${c.towboat===b?' selected':''}>${esc(b)}</option>`).join('')}
            ${c.towboat&&settings.towboats.indexOf(c.towboat)<0?`<option selected>${esc(c.towboat)}</option>`:''}
          </select>
        </div>

        <div class="sect-head lbl"><span>Screenshots</span><span class="rule"></span></div>
        <div class="photos" data-phzone>
          ${photos}
          <button class="ph phadd" data-phadd>+<small class="lbl">Redcraft · email</small></button>
        </div>
        <div class="hint" style="margin-top:8px">Drop the dispatch screenshot here the moment it comes in. Then tap it and hit Read into case — boat, member, phone and dispatch # fill themselves.</div>
        <input type="file" accept="image/*" multiple style="display:none" data-phinput>

        <div class="sect-head lbl"><span>Notes from the water</span><span class="rule"></span></div>
        <span class="chiplbl">Seas</span>
        <div class="chips" data-chip="seas">${['Flat','1–2 ft','2–3 ft','3–4 ft','4 ft+'].map(v=>`<button class="chip ${c.seas===v?'on':''}" data-v="${v}">${v}</button>`).join('')}</div>
        <span class="chiplbl">Wind</span>
        <div class="chips" data-chip="wind">${['Calm','5–10','10–15','15–20','20+'].map(v=>`<button class="chip ${c.wind===v?'on':''}" data-v="${v}">${v}</button>`).join('')}</div>
        ${field(c,'notes','Dictate as you go',{area:1,ph:'Tap the mic on your keyboard and talk. What the boat needed, what you did, anything the member said, anything odd.'})}
        <div class="hint">This is the field that saves you later. Say it out loud while it is happening — you will not remember it Thursday.</div>

        <details style="margin-top:14px">
          <summary class="lbl"><span class="flag ${has(['reason','locText','dest','pob','services'])?'on':''}"></span>Tow details</summary>
          <div class="fields">
            <span class="chiplbl">Reason for tow</span>
            <div class="chips" data-pick="reason">${['Engine failure','Engine overheat','Dead battery','Out of fuel','Aground','Prop foul','Steering'].map(v=>`<button class="chip ${c.reason===v?'on':''}" data-v="${v}">${v}</button>`).join('')}</div>
            ${field(c,'reason','Reason (or type your own)')}
            <span class="chiplbl">Tow location — quick pick</span>
            ${pickChips(c,'locText',settings.places)}
            ${field(c,'locText','Tow location')}
            <div class="row">${field(c,'lat','Latitude',{ph:"auto-filled at on scene"})}${field(c,'lng','Longitude',{ph:"auto"})}</div>
            <span class="chiplbl">Destination — quick pick</span>
            ${pickChips(c,'dest',settings.places)}
            ${field(c,'dest','Tow destination',{ph:'Home slip 22'})}
            <div class="row">${field(c,'pob','POB',{im:'numeric'})}${field(c,'contacted','Time contacted',{ph:'16:34'})}${field(c,'eta','ETA',{ph:'17:00'})}</div>
            ${field(c,'startLoc','Start location')}
            ${field(c,'wx','Weather — anything else',{ph:'SW swell, thin fog off the breakwater'})}
            ${field(c,'services','Description of services',{area:1,ph:'Soft tow, 2.4 nm, alongside for the last 200 yds'})}
          </div>
        </details>

        <details>
          <summary class="lbl"><span class="flag ${has(['make','regNum','ownerLast','memId'])?'on':''}"></span>Boat &amp; member</summary>
          <div class="fields">
            <div class="row">${field(c,'make','Make')}${field(c,'length','Length',{im:'numeric'})}</div>
            <div class="row">${field(c,'color','Color')}${field(c,'boatType','Type')}</div>
            ${field(c,'regNum','Registration #')}
            <div class="row">${field(c,'ownerFirst','First name')}${field(c,'ownerLast','Last name')}</div>
            ${field(c,'ownerPhone','Phone',{im:'tel'})}
            ${field(c,'ownerEmail','Email',{im:'email'})}
            <div class="row">${field(c,'memId','Member ID',{im:'numeric'})}${field(c,'coverage','Coverage',{im:'numeric'})}</div>
            <div class="row">${field(c,'expDate','Exp date')}${field(c,'dispatchNum','Dispatch #')}</div>
            ${field(c,'refNum','Ref num')}
            <div class="hint">${c.source==='vhf'?'You are building this case in VSS from scratch — get name, member ID and boat over the radio while you have them.':'Already in Redcraft — the screenshot above usually covers this. Only fill what you want in front of you at the desk.'}</div>
          </div>
        </details>

        <div style="margin-top:26px;display:flex;gap:9px">
          <button class="btn ghost lbl" data-status="${c.status==='filed'?'open':'filed'}" style="color:${c.status==='filed'?'var(--signal)':'var(--wake)'}">${c.status==='filed'?'Reopen':'Mark filed'}</button>
          <button class="btn ghost lbl" data-del style="color:var(--alarm);flex:0 0 90px">Delete</button>
        </div>
      </div>

      <div class="foot">
        <button class="btn lbl" data-boss style="flex:0 0 auto;width:auto;padding:15px 16px">Text boss</button>
        <button class="btn primary lbl" data-export>Open VSS sheet</button>
      </div>`;
  }

  /* ---------- render: settings ---------- */
  function renderSettings(){
    const listEditor=(key,label,ph)=>`
      <div class="sect-head lbl"><span>${label}</span><span class="rule"></span></div>
      ${settings[key].map((v,i)=>`<div class="set-item"><div class="n">${esc(v)}</div><button class="x" style="background:none;border:0;color:var(--ink-faint);font-size:16px;cursor:pointer" data-listdel="${key}:${i}">✕</button></div>`).join('')||'<div class="hint" style="margin:6px 0">Nothing yet.</div>'}
      <div class="addrow"><input placeholder="${ph}" data-listadd-input="${key}"><button class="btn lbl" data-listadd="${key}">Add</button></div>`;

    return `
      <div class="bar">
        <button class="back" data-back>‹</button>
        <div><h1 class="lbl">Settings</h1><div class="sub lbl">Set once · lives on your phone<span id="savestatus" class="savechip lbl"></span></div></div>
      </div>
      <div class="wrap">
        <div class="sect-head lbl"><span>Look</span><span class="rule"></span></div>
        <div class="chips">${Object.keys(THEMES).map(k=>`<button class="chip ${(settings.theme||'chart')===k?'on':''}" data-look="${k}">${THEME_NAMES[k]}</button>`).join('')}</div>
        <div class="hint">Flip through these on deck — midday glare and a night call read very differently. Pick the one you can actually use.</div>

        <div class="sect-head lbl" style="margin-top:24px"><span>Billing</span><span class="rule"></span></div>
        <div class="f" style="max-width:200px"><label>Minimum hours per call</label><input type="number" step="0.25" min="0" value="${settings.minHours}" data-setnum="minHours" inputmode="decimal"></div>
        <div class="hint">Every call bills at least this many hours, on the 24-hour clock, rounded to the nearest quarter. If the whole call runs under the minimum, the padding bills at whichever rate (day or night) was in effect at towboat out.</div>

        <div class="sect-head lbl" style="margin-top:24px"><span>Night hours</span><span class="rule"></span></div>
        <div class="seg">
          <button class="${settings.nightMode==='sun'?'on':''} lbl" data-nightmode="sun">Sunset → sunrise</button>
          <button class="${settings.nightMode==='fixed'?'on':''} lbl" data-nightmode="fixed">Fixed clock hours</button>
        </div>
        ${settings.nightMode==='fixed'?`
        <div class="row">
          <div class="f"><label>Night starts</label><input type="time" data-set="nightStart" value="${settings.nightStart}"></div>
          <div class="f"><label>Night ends</label><input type="time" data-set="nightEnd" value="${settings.nightEnd}"></div>
        </div>`:`<div class="hint">Uses actual Long Beach sunrise/sunset for the day of the tow. Switch to fixed hours if your shop defines night as, say, 1800–0600 — worth confirming with the boss.</div>`}

        ${listEditor('towboats','Towboats in the dropdown','e.g. Long Beach')}
        ${listEditor('places','Quick-pick locations','e.g. Los Alamitos Bay fuel dock')}

        <div class="sect-head lbl" style="margin-top:30px"><span>Storage &amp; backups</span><span class="rule"></span></div>
        <div class="set-item"><div class="n">Status</div><div class="mono" style="color:${frozen()?'var(--alarm)':'var(--wake)'};font-size:12px">${statusText()}</div></div>
        <div class="set-item"><div class="n">Where cases live</div><div class="mono" style="font-size:11px;color:var(--ink-dim)">This phone · this browser</div></div>
        <div class="set-item"><div class="n">Saves this session</div><div class="mono" style="font-size:12px">${writeCount}</div></div>
        ${lastErr?`<div class="set-item"><div class="n">Last error</div><div class="mono" style="font-size:11px;color:var(--alarm)">${esc(lastErr)}</div></div>`:''}
        <div class="set-item"><div class="n">Last backup to Files</div><div class="mono" style="font-size:12px;color:${settings.lastBackup?'var(--ink)':'var(--alarm)'}">${settings.lastBackup?dayLabel(settings.lastBackup)+' '+hhmm(settings.lastBackup):'NEVER'}</div></div>
        <div class="addrow"><button class="btn primary lbl" data-backupfile>Backup to Files</button><button class="btn lbl" data-importfile>Restore file</button></div>
        <div class="addrow"><button class="btn lbl" data-backup>Copy as text</button><button class="btn lbl" data-import>Paste text</button></div>
        <div class="hint" style="margin-top:8px">Cases save to the phone instantly, with a second copy and 7 days of daily snapshots. Backup to Files includes your screenshots and drops a dated file you can put in iCloud Drive — that copy survives anything, and Restore file brings it all back. Copy-as-text skips screenshots to stay small. Do it on payday.</div>
      </div>`;
  }

  /* ---------- export text ---------- */
  function vssText(c){
    const p=payHours(c);
    const L=[]; const line=(k,v)=>{if(v!==''&&v!=null)L.push(k.padEnd(22)+v);};
    const cd=new Date(c.createdAt);
    L.push('TOWBOATUS CASE  ·  '+cd.getFullYear()+'-'+pad(cd.getMonth()+1)+'-'+pad(cd.getDate())+' '+hhmm(c.createdAt));
    L.push('Source: '+(c.source==='vhf'?'VHF — create case in VSS':'BoatUS Dispatch / Redcraft'));
    L.push('');
    L.push('— TIMES —');
    STAGES.forEach((s,i)=>{
      let v=c[s.k]?hhmm(c[s.k]):'—';
      if(c[s.k]&&c.t1&&new Date(c[s.k]).getDate()!==new Date(c.t1).getDate()) v+='  ('+dayLabel(c[s.k])+')';
      line((i+1)+') '+s.n+':',v);
    });
    if(p){
      line('6) Total hrs billed:', p.totalQ.toFixed(2)+'   (exact '+p.exact.toFixed(2)+', nearest \u00BC hr'+(p.minApplied?', '+(settings.minHours||2)+'-hr min':'')+')');
      line('   Day hrs:', p.dayQ.toFixed(2));
      line('   Night hrs:', p.nightQ.toFixed(2));
    } else line('6) Total hrs billed:','—');
    line('Time contacted:',c.contacted);
    line('ETA:',c.eta);
    L.push('');
    L.push('— SERVICE —');
    line('Reason for tow:',c.reason);
    line('Tow location:',c.locText);
    line('Latitude:',c.lat);
    line('Longitude:',c.lng);
    line('Destination:',c.dest);
    line('#POB:',c.pob);
    line('Towboat used:',c.towboat);
    line('Start location:',c.startLoc);
    const wx=[c.seas&&'Seas '+c.seas,c.wind&&'Wind '+c.wind+' kts',c.wx].filter(Boolean).join(', ');
    line('Weather & sea:',wx);
    Object.keys(c.gps).forEach(k=>{
      const g=c.gps[k], s=STAGES.find(x=>x.k===k);
      line('GPS @ '+s.n+':', toDDM(g.lat,true)+'  '+toDDM(g.lng,false));
    });
    if((c.photos||[]).length) line('Screenshots:', c.photos.length+' attached (in app)');
    L.push('');
    L.push('— DISABLED BOAT —');
    line('Boat name:',c.boatName); line('Make:',c.make); line('Length:',c.length);
    line('Color:',c.color); line('Type:',c.boatType); line('Registration #:',c.regNum);
    L.push('');
    L.push('— CONTACT / MEMBER —');
    line('Owner:',[c.ownerFirst,c.ownerLast].filter(Boolean).join(' '));
    line('Phone:',c.ownerPhone); line('Email:',c.ownerEmail);
    line('Mem ID:',c.memId); line('Coverage:',c.coverage); line('Exp date:',c.expDate);
    line('Dispatch #:',c.dispatchNum); line('Ref num:',c.refNum);
    if(c.services){L.push('');L.push('— DESCRIPTION OF SERVICES —');L.push(c.services);}
    if(c.notes){L.push('');L.push('— NOTES FROM THE WATER —');L.push(c.notes);}
    return L.join('\n');
  }

  function bossText(c){
    const p=payHours(c);
    const title=caseTitle(c);
    const bits=[];
    bits.push('Case '+dayLabel(c.createdAt)+' — '+title+(c.reason?' ('+c.reason+')':''));
    if(c.t1) bits.push('Out '+hhmm(c.t1)+(c.t5?' / at base '+hhmm(c.t5):' — still out'));
    if(p) bits.push('Hours: '+p.totalQ.toFixed(2)+' ('+p.dayQ.toFixed(2)+' day / '+p.nightQ.toFixed(2)+' night)');
    if(c.locText) bits.push('From: '+c.locText);
    if(c.dest) bits.push('To: '+c.dest);
    if(c.dispatchNum) bits.push('Dispatch # '+c.dispatchNum);
    bits.push(c.source==='vhf'?'VHF call — I\u2019ll build it in VSS':'Redcraft dispatch');
    return bits.join('\n');
  }

  function renderSheet(title, txt){
    const el=document.createElement('div');
    el.className='sheet';
    el.innerHTML=`<div class="sheet-in">
      <div class="sheet-hd lbl"><span>${title}</span></div>
      <div class="sheet-bd"><pre>${esc(txt)}</pre></div>
      <div class="sheet-ft">
        <button class="btn lbl" data-close>Close</button>
        <button class="btn primary lbl" data-copy>Copy all</button>
      </div>
    </div>`;
    el.addEventListener('click',e=>{
      if(e.target===el||e.target.closest('[data-close]')) el.remove();
      if(e.target.closest('[data-copy]')) copy(txt);
    });
    document.body.appendChild(el);
  }

  function copy(txt){
    const done=()=>toast('Copied');
    if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(done).catch(fb);}else fb();
    function fb(){
      const ta=document.createElement('textarea');
      ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';
      document.body.appendChild(ta);ta.select();
      try{document.execCommand('copy');done();}catch(e){toast('Select the text and copy',1);}
      ta.remove();
    }
  }

  /* ---------- time edit modal ---------- */
  function editTime(c,k){
    const s=STAGES.find(x=>x.k===k);
    const cur=c[k]?hhmm(c[k]):'';
    const el=document.createElement('div');
    el.className='modal';
    el.innerHTML=`<div class="modal-in">
      <h3 class="lbl">${s.n}</h3>
      <input class="tin mono" type="time" value="${cur}">
      <div class="mrow">
        <button class="btn ghost lbl" data-clear style="color:var(--alarm)">Clear</button>
        <button class="btn ghost lbl" data-cancel>Cancel</button>
        <button class="btn primary lbl" data-ok>Set</button>
      </div>
    </div>`;
    const input=el.querySelector('input');
    el.addEventListener('click',e=>{
      if(e.target===el||e.target.closest('[data-cancel]')){el.remove();return;}
      if(e.target.closest('[data-clear]')){c[k]=null;saveCases();el.remove();render();return;}
      if(e.target.closest('[data-ok]')){
        const v=input.value;
        if(!v){el.remove();return;}
        const [h,m]=v.split(':').map(Number);
        const base=new Date(c.t1||c.createdAt);
        const d=new Date(base);d.setHours(h,m,0,0);
        const idx=STAGES.findIndex(x=>x.k===k);
        for(let i=idx-1;i>=0;i--){if(c[STAGES[i].k]&&d.getTime()<c[STAGES[i].k]){d.setDate(d.getDate()+1);break;}}
        c[k]=d.getTime();saveCases();el.remove();render();
      }
    });
    document.body.appendChild(el);
    setTimeout(()=>input.focus(),50);
  }

  /* ---------- mount ---------- */
  function render(){
    const app=document.getElementById('app');
    const openSections=[...app.querySelectorAll('details')].map(d=>d.open);
    app.innerHTML=view.screen==='list'?renderList():(view.screen==='settings'?renderSettings():renderCase());
    if(view.screen==='case'){
      [...app.querySelectorAll('details')].forEach((d,i)=>{if(openSections[i]!==undefined)d.open=openSections[i];});
    }
    tick();
    paintStatus();
    hydratePhotos();
  }
  function tick(){
    clearInterval(ticker);
    if(view.screen!=='case')return;
    const c=getCase(view.id);
    if(!c||!c.t1||c.t5)return;
    ticker=setInterval(()=>{
      const el=document.getElementById('bigclock');
      if(!el){clearInterval(ticker);return;}
      el.textContent=hms(liveMs(c));
    },1000);
  }

  /* ---------- events ---------- */
  document.addEventListener('click',e=>{
    const t=e.target;

    if(t.closest('[data-retrystore]')){retryStore();return;}
    if(t.closest('[data-copyall]')){
      const all=cases.length?cases.map(c=>vssText(c)).join('\n\n'+'='.repeat(46)+'\n\n'):'No cases yet.';
      renderSheet('Every case — copy this somewhere safe',all);
      return;
    }
    if(t.closest('[data-phadd]')){
      const inp=document.querySelector('[data-phinput]');
      if(inp){inp.value='';inp.click();}
      return;
    }
    const pv=t.closest('[data-phview]');
    if(pv){viewPhoto(pv.dataset.phview);return;}
    if(t.closest('[data-focusname]')){
      const n=document.getElementById('casename');
      if(n){n.scrollIntoView({block:'center',behavior:'smooth'});n.focus();n.select();}
      return;
    }
    if(t.closest('[data-backup]')){
      const raw=pack();
      if(navigator.share){navigator.share({text:raw}).catch(()=>renderSheet('Backup — copy and keep it somewhere safe',raw));}
      else renderSheet('Backup — copy and keep it somewhere safe',raw);
      return;
    }
    if(t.closest('[data-import]')){importModal();return;}
    if(t.closest('[data-backupfile]')){backupToFiles();return;}
    if(t.closest('[data-importfile]')){restoreFromFile();return;}

    const nb=t.closest('[data-new]');
    if(nb){const c=blank(nb.dataset.new);cases.push(c);saveCases();view={screen:'case',id:c.id};render();return;}

    const oc=t.closest('[data-open]');
    if(oc){view={screen:'case',id:oc.dataset.open};render();return;}
    if(t.closest('[data-back]')){view={screen:'list'};render();return;}
    if(t.closest('[data-settings]')){view={screen:'settings'};render();return;}

    const stampEl=t.closest('[data-stamp]');
    if(stampEl){
      const c=getCase(view.id),k=stampEl.dataset.stamp;
      if(c[k]){editTime(c,k);}
      else{
        c[k]=Date.now();grabGPS(c,k);saveCases();render();
        toast(STAGES.find(s=>s.k===k).n+' '+hhmm(c[k]));
      }
      return;
    }

    if(t.closest('[data-rollover]')){
      const c=getCase(view.id);
      const now=Date.now();
      c.t5=now;grabGPS(c,'t5');
      const nc=blank(c.source);
      nc.t1=now;nc.towboat=c.towboat;nc.startLoc=c.dest||'';
      grabGPS(nc,'t1');
      cases.push(nc);saveCases();
      view={screen:'case',id:nc.id};render();
      toast('Rolled — new case running from '+hhmm(now));
      return;
    }

    const chip=t.closest('[data-chip] .chip');
    if(chip){
      const grp=chip.closest('[data-chip]').dataset.chip;
      const c=getCase(view.id);
      c[grp]=c[grp]===chip.dataset.v?'':chip.dataset.v;
      saveCases();render();return;
    }
    const pick=t.closest('[data-pick] .chip');
    if(pick){
      const grp=pick.closest('[data-pick]').dataset.pick;
      const c=getCase(view.id);
      c[grp]=c[grp]===pick.dataset.v?'':pick.dataset.v;
      saveCases();render();return;
    }

    const stt=t.closest('[data-status]');
    if(stt){const c=getCase(view.id);c.status=stt.dataset.status;saveCases();view={screen:'list'};render();toast(c.status==='filed'?'Marked filed':'Reopened');return;}

    if(t.closest('[data-del]')){
      const c=getCase(view.id);
      const el=document.createElement('div');el.className='modal';
      el.innerHTML=`<div class="modal-in">
        <h3 class="lbl">Delete this case for good?</h3>
        <div style="font-size:13px;color:var(--ink-dim);margin:10px 0 14px;line-height:1.5">${esc(caseTitle(c))} — ${c.t1?'stamped, ':''}gone from the log and the unfiled total. No undo.</div>
        <div class="mrow">
          <button class="btn ghost lbl" data-cancel>Keep it</button>
          <button class="btn lbl" data-ok style="background:var(--alarm);border-color:var(--alarm);color:#fff;font-weight:700">Delete</button>
        </div>
      </div>`;
      el.addEventListener('click',ev=>{
        if(ev.target===el||ev.target.closest('[data-cancel]')){el.remove();return;}
        if(ev.target.closest('[data-ok]')){
          cases=cases.filter(x=>x.id!==view.id);saveCases();
          el.remove();view={screen:'list'};render();toast('Case deleted');
        }
      });
      document.body.appendChild(el);
      return;
    }
    if(t.closest('[data-export]')){renderSheet('VSS sheet — read across as you type',vssText(getCase(view.id)));return;}
    if(t.closest('[data-boss]')){
      const txt=bossText(getCase(view.id));
      if(navigator.share){navigator.share({text:txt}).catch(()=>renderSheet('Text for the boss',txt));}
      else renderSheet('Text for the boss',txt);
      return;
    }

    /* settings */
    const lk=t.closest('[data-look]');
    if(lk){settings.theme=lk.dataset.look;applyTheme();persist();render();return;}
    const nm=t.closest('[data-nightmode]');
    if(nm){settings.nightMode=nm.dataset.nightmode;saveSettings();render();return;}
    const ld=t.closest('[data-listdel]');
    if(ld){const [key,i]=ld.dataset.listdel.split(':');settings[key].splice(+i,1);saveSettings();render();return;}
    const la=t.closest('[data-listadd]');
    if(la){
      const key=la.dataset.listadd;
      const inp=document.querySelector(`[data-listadd-input="${key}"]`);
      const v=inp.value.trim();
      if(v){settings[key].push(v);saveSettings();render();}
      return;
    }
  });

  document.addEventListener('change',e=>{
    const el=e.target;
    if(el.matches&&el.matches('[data-phinput]')){addPhotos([...el.files]);return;}
    if(el.tagName==='SELECT'&&el.dataset.f){
      const c=getCase(view.id);if(!c)return;
      c[el.dataset.f]=el.value;persist();
    }
  });
  document.addEventListener('dragover',e=>{
    const z=e.target.closest&&e.target.closest('[data-phzone]');
    if(z){e.preventDefault();z.classList.add('dragover');}
  });
  document.addEventListener('dragleave',e=>{
    const z=e.target.closest&&e.target.closest('[data-phzone]');
    if(z)z.classList.remove('dragover');
  });
  document.addEventListener('drop',e=>{
    const z=e.target.closest&&e.target.closest('[data-phzone]');
    if(z){e.preventDefault();z.classList.remove('dragover');if(e.dataTransfer&&e.dataTransfer.files.length)addPhotos([...e.dataTransfer.files]);}
  });

  document.addEventListener('input',e=>{
    const el=e.target;
    if(el.dataset.f!==undefined&&el.dataset.f){
      const c=getCase(view.id);if(!c)return;
      c[el.dataset.f]=el.value;
      document.querySelectorAll('[data-f="'+el.dataset.f+'"]').forEach(o=>{if(o!==el&&o.value!==el.value)o.value=el.value;});
      if(['boatName','ownerFirst','ownerLast','make','length'].indexOf(el.dataset.f)>-1){
        const h=document.getElementById('casetitle'); if(h)h.textContent=caseTitle(c);
      }
      saveCases(1);return;
    }
    if(el.dataset.setnum){
      settings[el.dataset.setnum]=parseFloat(el.value)||0;saveSettings(1);return;
    }
    if(el.dataset.set){
      settings[el.dataset.set]=el.value;saveSettings(1);return;
    }
  });

  load().then(()=>{
    applyTheme();
    render();
    if(saveState==='nostore'){
      const w=document.createElement('div');
      w.id='storebanner';w.className='storebanner';w.style.background='var(--alarm)';
      w.innerHTML='This version keeps its cases on the phone itself — and this browser is not allowing that. That happens inside the Claude app or in a Private tab. Open this link in regular Safari, then Share → Add to Home Screen.'
        +'<br><button class="lbl" data-copyall>Copy everything out</button>';
      document.body.appendChild(w);
      document.getElementById('app').style.paddingTop='72px';
    }
  });
})();
</script>
